packages:
  - name: core-files
    labels: [aarch64, riscv64]
    architecture: noarch
    metadata:
      summary: Managarm base filesystem layout
      description: This package provides the base filesystem layout that Managarm uses, includes various directories, essential files and symlinks.
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-apps']
    default: true
    source:
      subdir: meta-sources
      version: '1.0'
    revision: 22
    config_files:
      - '/etc/passwd'
      - '/etc/group'
      - '/etc/shadow'
      - '/etc/gshadow'
      - '/etc/hosts'
      - '/etc/resolv.conf'
    configure: []
    build:
      # Create initial directories; provision-sysroot.py --base-dirs creates the mount points
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/etc']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/root']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/home']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/share']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/var']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/bin']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/lib']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/sbin']
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/opt']
      # xbps does not install empty directories, .keep files fixes this
      - args: ['touch', '@THIS_COLLECT_DIR@/etc/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/root/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/home/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/var/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/usr/bin/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/usr/sbin/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/usr/lib/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/usr/share/.keep']
      - args: ['touch', '@THIS_COLLECT_DIR@/opt/.keep']
      # Install a default passwd, group, resolv.conf and hosts
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/passwd', '@THIS_COLLECT_DIR@/etc']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/group', '@THIS_COLLECT_DIR@/etc']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/shadow', '@THIS_COLLECT_DIR@/etc']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/gshadow', '@THIS_COLLECT_DIR@/etc']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/resolv.conf', '@THIS_COLLECT_DIR@/etc']
      - args: ['cp', '@SOURCE_ROOT@/extrafiles/hosts', '@THIS_COLLECT_DIR@/etc']
      # Install the default config.site
      - args: ['cp', '@SOURCE_ROOT@/scripts/config.site', '@THIS_COLLECT_DIR@/usr/share']
      # Link /bin, /lib and /sbin to their /usr counterparts
      - args: ['ln', '-svf', 'usr/bin', '@THIS_COLLECT_DIR@/bin']
      - args: ['ln', '-svf', 'usr/lib', '@THIS_COLLECT_DIR@/lib']
      - args: ['ln', '-svf', 'usr/sbin', '@THIS_COLLECT_DIR@/sbin']

  - name: managarm-scripts
    labels: [aarch64, riscv64]
    architecture: noarch
    metadata:
      summary: Managarm distribution scripts
      description: This package provides scripts that build or maintain a Managarm installation
      spdx: 'MIT'
      website: 'https://managarm.org'
      maintainer: "Alexander van der Grinten <avdgrinten@managarm.org>"
      categories: ['sys-apps']
    default: true
    source:
      subdir: meta-sources
      version: '1.0'
    revision: 7
    configure: []
    build:
      # Laid out as in extrafiles/managarm-scripts, so that the scripts find their data files next to themselves.
      - args: ['install', '-Dm755', '@SOURCE_ROOT@/extrafiles/managarm-scripts/update-boot.py', '@THIS_COLLECT_DIR@/usr/managarm/lib/managarm-scripts/update-boot.py']
      - args: ['install', '-Dm755', '@SOURCE_ROOT@/extrafiles/managarm-scripts/provision-sysroot.py', '@THIS_COLLECT_DIR@/usr/managarm/lib/managarm-scripts/provision-sysroot.py']
      - args: ['install', '-Dm755', '@SOURCE_ROOT@/extrafiles/managarm-scripts/managarm-install.py', '@THIS_COLLECT_DIR@/usr/managarm/lib/managarm-scripts/managarm-install.py']
      - args: ['install', '-Dm755', '@SOURCE_ROOT@/extrafiles/managarm-scripts/devpkgs.py', '@THIS_COLLECT_DIR@/usr/managarm/lib/managarm-scripts/devpkgs.py']
      - args: ['install', '-Dm644', '@SOURCE_ROOT@/extrafiles/managarm-scripts/xbps-keys/5d:d2:5b:a6:50:95:c7:b9:a4:10:e4:63:39:d0:b8:c5.plist', '@THIS_COLLECT_DIR@/usr/managarm/lib/managarm-scripts/xbps-keys/5d:d2:5b:a6:50:95:c7:b9:a4:10:e4:63:39:d0:b8:c5.plist']
      # update-image.py and the provision-sysroot task run these from the sysroot, so they live at the same paths on the host and the target.
      - args: ['mkdir', '-p', '@THIS_COLLECT_DIR@/usr/managarm/bin']
      - args: ['ln', '-svf', '../lib/managarm-scripts/update-boot.py', '@THIS_COLLECT_DIR@/usr/managarm/bin/update-boot.py']
      - args: ['ln', '-svf', '../lib/managarm-scripts/provision-sysroot.py', '@THIS_COLLECT_DIR@/usr/managarm/bin/provision-sysroot.py']
      - args: ['ln', '-svf', '../lib/managarm-scripts/managarm-install.py', '@THIS_COLLECT_DIR@/usr/managarm/bin/managarm-install.py']
      - args: ['ln', '-svf', '../lib/managarm-scripts/devpkgs.py', '@THIS_COLLECT_DIR@/usr/managarm/bin/devpkgs.py']
    scripts:
      post_install:
        - args: ['/usr/managarm/bin/update-boot.py', 'update-esp']
