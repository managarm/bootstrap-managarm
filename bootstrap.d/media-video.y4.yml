!<tag:y4.managarm.org:preamble>
import:
  - !managarm
---
packages:
  - name: ffmpeg
    architecture: '@OPTION:arch@'
    metadata:
      summary: Complete solution to record/convert/stream audio and video. Includes libavcodec
      description: FFmpeg is a solution to record, convert and stream audio and video. It is a very fast video and audio converter and it can also acquire from a live audio/video source.FFmpeg is a solution to record, convert and stream audio and video. It is a very fast video and audio converter and it can also acquire from a live audio/video source.
      spdx: 'GPL-2.0-only'
      website: 'https://ffmpeg.org/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['media-video']
    source:
      subdir: 'ports'
      git: 'https://github.com/FFmpeg/FFmpeg.git'
      tag: 'n9.0.1'
      version: '9.0.1'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - bzip2
      - fontconfig
      - freetype
      - fribidi
      - harfbuzz
      - libdrm
      - libglvnd
      - libiconv
      - libtheora
      - libvorbis
      - libvpx
      - libwebp
      - libx11
      - libxcb
      - libxext
      - libxml
      - openssl
      - opus
      - sdl2
    revision: 1
    configure:
      # Object files are placed where configure is launched
      - args: ['cp', '-r', '@THIS_SOURCE_DIR@/.', '@THIS_BUILD_DIR@']
      - args:
        - './configure'
        - '--disable-everything' # Enable only what we need / want / support
        # But enable all components that we can (the line above is more for dependencies)
        - '--enable-decoders'
        - '--enable-encoders'
        - '--enable-hwaccels'
        - '--enable-parsers'
        - '--enable-demuxers'
        - '--enable-muxers'
        - '--enable-protocols'
        - '--enable-filters'
        - '--enable-bsfs'
        - '--enable-indevs'
        - '--enable-outdevs'
        - '--prefix=/usr'
        - '--enable-gpl' # Enable more plugins
        - '--enable-version3' # Enable more plugins
        - '--enable-nonfree' # Enable more plugins (may mean unredistributable)
        - '--disable-static'
        - '--enable-shared'
        - '--disable-stripping'
        - '--docdir=/usr/share/doc/ffmpeg-9.0.1'
        - '--disable-alsa'
        - '--enable-iconv'
        - '--enable-pic'
        - '--enable-ffplay'
        - '--enable-openssl'
        - '--enable-bzlib'
        - '--enable-sdl2'
        - '--enable-libxml2'
        - '--enable-opengl'
        - '--enable-libxcb'
        - '--enable-libxcb-shm'
        - '--enable-libxcb-xfixes'
        - '--enable-libxcb-shape'
        - '--disable-xlib' # Missing libxv
        - '--enable-zlib'
        # Start cross compilation config
        - '--enable-cross-compile'
        - '--arch=@OPTION:arch@'
        - '--cross-prefix=@OPTION:arch-triple@'
        - '--host-cc=gcc'
        - '--target-os=linux' # Fun times ahead
        - '--cc=@OPTION:arch-triple@-gcc'
        - '--cxx=@OPTION:arch-triple@-g++'
        - '--ar=@OPTION:arch-triple@-ar'
        - '--nm=@OPTION:arch-triple@-nm'
        - '--strip=@OPTION:arch-triple@-strip'
        - '--ranlib=@OPTION:arch-triple@-ranlib'
        - '--pkg-config=@OPTION:arch-triple@-pkg-config'
        # End cross compilation config
        - '--enable-libfontconfig'
        - '--enable-libfreetype'
        - '--enable-libfribidi'
        - '--enable-libharfbuzz'
        - '--enable-libvorbis'
        - '--enable-libtheora'
        - '--enable-libwebp'
        - '--enable-libdrm'
        - '--enable-libopus'
        - '--enable-libvpx'
        - '--ignore-tests=enhanced-flv-av1,enhanced-flv-multitrack'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: ffmpeg-dbg
        include: ['/usr/lib/debug/**']

  - name: pipewire
    architecture: '@OPTION:arch@'
    metadata:
      summary: Low-latency audio/video router and processor
      description: Low-latency audio/video router and processor.
      spdx: 'MIT'
      website: 'https://pipewire.org'
      maintainer: "Qwinci <qwinci222@gmail.com>"
      categories: ['media-video']
    source:
      subdir: 'ports'
      git: 'https://gitlab.freedesktop.org/pipewire/pipewire.git'
      tag: '1.6.6'
      version: '1.6.6'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - alsa-lib
      - dbus
      - glib
      - gst-plugins-base
      - gstreamer
      - libcanberra
      - libintl
      - libpulse
      - libx11
      - libxfixes
      - ncurses
      - systemd
    revision: 4
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '-Ddbus=enabled'
        - '-Dtests=disabled'
        - '-Dinstalled_tests=disabled'
        - '-Dgstreamer=enabled'
        - '-Dgstreamer-device-provider=enabled'
        - '-Dgsettings=enabled'
        - '-Dlibsystemd=enabled'
        - '-Dlogind=enabled'
        - '-Dlogind-provider=libsystemd'
        - '-Dsystemd-user-service=enabled'
        - '-Dpipewire-alsa=enabled'
        - '-Dspa-plugins=enabled'
        - '-Dalsa=enabled'
        - '-Dcompress-offload=disabled'
        - '-Daudiomixer=enabled'
        - '-Daudioconvert=enabled'
        - '-Dcontrol=enabled'
        - '-Dffmpeg=disabled'
        - '-Dsupport=enabled'
        - '-Devl=disabled'
        - '-Dtest=disabled'
        - '-Dlibcamera=disabled'
        - '-Dvideoconvert=enabled'
        - '-Dvolume=enabled'
        - '-Dvulkan=disabled'
        - '-Dudev=enabled'
        - '-Dlibmysofa=disabled'
        - '-Dsession-managers=[]'
        - '-Dx11=enabled'
        - '-Dx11-xfixes=enabled'
        - '-Dlibcanberra=enabled'
        - '-Dgsettings-pulse-schema=enabled'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['systemctl', 'enable', '--global', '--root', '@THIS_COLLECT_DIR@', 'pipewire.socket']
      - args: ['systemctl', 'enable', '--global', '--root', '@THIS_COLLECT_DIR@', 'pipewire-pulse.socket']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: pipewire-dbg
        include: ['/usr/lib/debug/**']

  - name: wireplumber
    architecture: '@OPTION:arch@'
    metadata:
      summary: Session / policy manager implementation for PipeWire
      description: Session / policy manager implementation for PipeWire.
      spdx: 'MIT'
      website: 'https://pipewire.org'
      maintainer: "Qwinci <qwinci222@gmail.com>"
      categories: ['media-video']
    source:
      subdir: 'ports'
      git: 'https://gitlab.freedesktop.org/pipewire/wireplumber.git'
      tag: '0.5.14'
      version: '0.5.14'
    tools_required:
      - system-gcc
      - host-pkg-config
      - virtual: pkgconfig-for-target
        triple: "@OPTION:arch-triple@"
    pkgs_required:
      - mlibc
      - glib
      - libintl
      - lua
      - pipewire
      - systemd
    revision: 3
    configure:
      - args:
        - 'meson'
        - 'setup'
        - '--native-file'
        - '@SOURCE_ROOT@/scripts/meson.native-file'
        - '--cross-file'
        - '@SOURCE_ROOT@/scripts/meson-@OPTION:arch-triple@.cross-file'
        - '--prefix=/usr'
        - '--libdir=lib'
        - '--buildtype=debugoptimized'
        - '-Ddaemon=true'
        - '-Dtools=true'
        - '-Dmodules=true'
        - '-Ddoc=disabled'
        - '-Dintrospection=disabled'
        - '-Dsystem-lua=true'
        - '-Dsystemd=enabled'
        - '-Dsystemd-user-service=true'
        - '-Dtests=false'
        - '-Ddbus-tests=false'
        - '@THIS_SOURCE_DIR@'
    build:
      - args: ['ninja']
      - args: ['ninja', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['systemctl', 'enable', '--global', '--root', '@THIS_COLLECT_DIR@', 'wireplumber']
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: wireplumber-dbg
        include: ['/usr/lib/debug/**']
