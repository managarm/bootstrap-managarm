packages:
  - name: dosfstools
    architecture: '@OPTION:arch@'
    metadata:
      summary: DOS filesystem tools - provides mkdosfs, mkfs.msdos, mkfs.vfat
      description: This package contains various utilities for use with the FAT family of file systems.
      spdx: 'GPL-3.0-only'
      website: 'https://github.com/dosfstools/dosfstools'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-fs']
    source:
      subdir: 'ports'
      git: 'https://github.com/dosfstools/dosfstools.git'
      tag: 'v4.2'
      version: '4.2'
      tools_required:
        - host-autoconf-v2.69
        - host-automake-v1.15
      regenerate:
        - args: ['./autogen.sh']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - libiconv
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--enable-compat-symlinks'
        - '--mandir=/usr/share/man'
        - '--docdir=/usr/share/doc/dosfstools-4.2'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: dosfstools-dbg
        include: ['/usr/lib/debug/**']

  - name: e2fsprogs
    architecture: '@OPTION:arch@'
    metadata:
      summary: Standard EXT2/EXT3/EXT4 filesystem utilities
      description: This package contains the utilities for handling the ext2 file system. It also supports the ext3 and ext4 journaling file systems.
      spdx: 'GPL-2.0-only BSD'
      website: 'http://e2fsprogs.sourceforge.net/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-fs']
    source:
      subdir: 'ports'
      git: 'https://github.com/tytso/e2fsprogs.git'
      tag: 'v1.47.4'
      version: '1.47.4'
      tools_required:
        - host-autoconf-archive
        - host-autoconf-v2.72
        - host-automake-v1.16
        - host-gettext
        - host-libtool
        - host-pkg-config
      regenerate:
        - args: ['autoreconf', '-fvi']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - libintl
      - libarchive
      - util-linux-libs
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
        - '--enable-elf-shlibs'
        - '--disable-libblkid'
        - '--disable-libuuid'
        - '--disable-uuidd'
        - '--disable-fsck'
        - '--with-systemd-unit-dir=/usr/lib/systemd/system'
        - '--with-udev-rules-dir=/usr/lib/udev/rules.d'
        - '--enable-symlink-install'
        - '--with-pthread'
        - '--enable-largefile'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: e2fsprogs-dbg
        include: ['/usr/lib/debug/**']

  - name: mtools
    architecture: '@OPTION:arch@'
    metadata:
      summary: Utilities to access MS-DOS disks without mounting them
      description: This package provides tools to read, write and manipulate files on FAT file systems, such as the EFI system partition, without mounting them.
      spdx: 'GPL-3.0-or-later'
      website: 'https://www.gnu.org/software/mtools/'
      maintainer: "Dennis Bonke <dennis@managarm.org>"
      categories: ['sys-fs']
    source:
      subdir: 'ports'
      url: 'https://ftp.fau.de/gnu/mtools/mtools-4.0.49.tar.bz2'
      checksum: 'blake2b:4147fb151392a920f691ca543bd5d6fd0be83fd1b59cd610747eeb2a9c19633e17f15aa0a85659433e70e802bf6ccb6ec07f4d1357f7417d58e238476d68db19'
      format: tar.bz2
      extract_path: 'mtools-4.0.49'
      version: '4.0.49'
      tools_required:
        - host-automake-v1.15
      regenerate:
        - args: ['cp',
            '@BUILD_ROOT@/tools/host-automake-v1.15/share/automake-1.15/config.sub',
            '@THIS_SOURCE_DIR@/']
    tools_required:
      - system-gcc
    pkgs_required:
      - mlibc
      - libiconv
    revision: 1
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--sysconfdir=/etc'
        - '--without-x'
        environ:
          # configure does not detect that iconv lives in libiconv.
          LIBS: '-liconv'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
      - args: ['@SOURCE_ROOT@/scripts/split-debug.py', '--binutils', '@THIS_COLLECT_DIR@']
    subpackages:
      - name: mtools-dbg
        include: ['/usr/lib/debug/**']
