!<tag:y4.managarm.org:preamble>
import:
  - !managarm
---
sources:
  - name: image_create
    subdir: 'ports'
    git: 'https://github.com/qookei/image_create.git'
    branch: 'master'
    rolling_version: true
    version: '0.0pl@ROLLING_ID@'

  - name: limine
    subdir: 'ports'
    git: 'https://github.com/Limine-Bootloader/Limine.git'
    tag: 'v12.9.1'
    version: '12.9.1'
    tools_required:
      - host-autoconf-v2.69
      - host-automake-v1.16
    regenerate:
      - args: ['./bootstrap']
        isolate_network: false

tools:
  - name: host-limine
    architecture: '@OPTION:arch@'
    labels: [aarch64, riscv64]
    from_source: limine
    tools_required:
      - host-llvm-toolchain
    revision: 2
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--prefix=@PREFIX@'
        - '--enable-all'
        - 'LDFLAGS=-static'
    compile:
      - args: ['make', '-j@PARALLELISM@']
    install:
      - args: ['mkdir', '-p', '@PREFIX@/share/limine']
      - args: ['cp', '-rv', 'bin/.', '@PREFIX@/share/limine/']

packages:
  - name: limine
    labels: [aarch64, riscv64]
    architecture: '@OPTION:arch@'
    from_source: limine
    tools_required:
      - system-gcc
      - host-llvm-toolchain
    pkgs_required:
      - mlibc
    revision: 2
    configure:
      - args:
        - '@THIS_SOURCE_DIR@/configure'
        - '--host=@OPTION:arch-triple@'
        - '--prefix=/usr'
        - '--enable-all'
    build:
      - args: ['make', '-j@PARALLELISM@']
      - args: ['make', 'install']
        environ:
          DESTDIR: '@THIS_COLLECT_DIR@'
